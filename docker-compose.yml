# Starts Kafka, Redis, and PostgreSQL. Ports avoid the defaults, in case other projects use them.
services:
  kafka:
    image: apache/kafka:3.9.0
    environment:
      # UseSVE=0 stops a JVM crash on recent Apple Silicon. The other flag lets
      # JVMs on other chips, which don't know that setting, ignore it.
      KAFKA_OPTS: "-XX:+IgnoreUnrecognizedVMOptions -XX:UseSVE=0"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: localdevpassword
      POSTGRES_DB: fraud
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud"]
      interval: 5s
      retries: 20
